[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techshort"
version = "0.1.0"
description = "Local-first evidence-linked technical explainer compiler"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic==2.13.4",
  "pypdf==6.14.2",
  "rich==14.3.4",
  "streamlit==1.59.2",
  "typer==0.26.8",
]

[project.optional-dependencies]
dev = ["mypy==1.20.2", "pytest==8.4.2", "pytest-cov==6.3.0", "ruff==0.15.21"]

[project.scripts]
techshort = "techshort.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/techshort"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S404", "S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
